<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>คำขอเผยแพร่ - Monnt Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Prompt',sans-serif}</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <header class="border-b bg-white">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-4 py-4">
      <a href="./" class="font-bold text-violet-700"><i class="fa-solid fa-code mr-2"></i>Monnt Hub</a>
      <a href="./" class="rounded-xl border px-4 py-2 text-sm">กลับหน้าหลัก</a>
    </div>
  </header>
  <main class="mx-auto max-w-4xl px-4 py-8">
    <div class="mb-6 rounded-3xl bg-gradient-to-r from-violet-600 to-indigo-600 p-6 text-white shadow-lg">
      <h1 class="text-2xl font-bold"><i class="fa-solid fa-clipboard-list mr-2"></i>คำขอเผยแพร่</h1>
      <p class="mt-2 text-sm text-white/80">ติดตามผลการตรวจสอบจาก Admin</p>
    </div>
    <div class="mb-5 grid grid-cols-3 gap-3">
      <div class="rounded-2xl border bg-white p-4"><p class="text-xs text-slate-500">ทั้งหมด</p><p id="countAll" class="mt-1 text-2xl font-bold">—</p></div>
      <div class="rounded-2xl border bg-white p-4"><p class="text-xs text-slate-500">รอตรวจสอบ</p><p id="countPending" class="mt-1 text-2xl font-bold text-amber-600">—</p></div>
      <div class="rounded-2xl border bg-white p-4"><p class="text-xs text-slate-500">อนุมัติแล้ว</p><p id="countApproved" class="mt-1 text-2xl font-bold text-emerald-600">—</p></div>
    </div>
    <div class="mb-4 flex items-center justify-between gap-3">
      <h2 class="text-lg font-bold">ประวัติคำขอของฉัน</h2>
      <button id="refreshButton" class="rounded-xl border bg-white px-3 py-2 text-sm"><i class="fa-solid fa-rotate mr-1"></i>รีเฟรช</button>
    </div>
    <div id="message" class="mb-4 hidden rounded-xl p-4 text-sm"></div>
    <div id="requestList" class="space-y-4"></div>
  </main>
  <script>
    const SUPABASE_URL = 'https://ofwlofzqxfdqctmogntu.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_JMUKzfqgrnXJwYy_zjLzKg_vMDyJTld';
    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}}
    );
    const list = document.getElementById('requestList');
    const message = document.getElementById('message');

    function showMessage(text, error=false) {
      message.textContent = text;
      message.className = 'mb-4 rounded-xl p-4 text-sm ' +
        (error ? 'bg-red-50 text-red-700' : 'bg-blue-50 text-blue-700');
    }
    function statusInfo(status) {
      const value = String(status || '').toLowerCase();
      if (['approved','approve'].includes(value))
        return {label:'อนุมัติแล้ว',style:'bg-emerald-50 text-emerald-700',icon:'fa-circle-check'};
      if (['rejected','declined','denied'].includes(value))
        return {label:'ปฏิเสธ',style:'bg-red-50 text-red-700',icon:'fa-circle-xmark'};
      if (['superseded','cancelled','canceled'].includes(value))
        return {label:'คำขอถูกแทนที่',style:'bg-slate-100 text-slate-600',icon:'fa-circle-info'};
      return {label:'รอตรวจสอบ',style:'bg-amber-50 text-amber-700',icon:'fa-clock'};
    }
    function formatDate(value) {
      if (!value) return 'ไม่ระบุ';
      return new Date(value).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
    }
    async function loadRequests() {
      list.innerHTML = '<div class="rounded-2xl border bg-white p-8 text-center text-slate-500">กำลังโหลดคำขอ...</div>';
      message.classList.add('hidden');

      const {data:{user},error:authError} = await supabaseClient.auth.getUser();
      if (authError || !user) {
        ['countAll','countPending','countApproved'].forEach(id =>
          document.getElementById(id).textContent = '0');
        list.innerHTML = '';
        showMessage('กรุณาเข้าสู่ระบบด้วยบัญชีที่ใช้ส่งคำขอเผยแพร่',true);
        return;
      }

      const {data,error} = await supabaseClient
        .from('publication_requests')
        .select('id,title,status,submitted_at,reviewed_at,review_note,version_no,script_id')
        .eq('requester_id',user.id)
        .order('submitted_at',{ascending:false});

      if (error) {
        console.error('loadRequests:',error);
        list.innerHTML = '';
        showMessage('โหลดคำขอไม่สำเร็จ: ' + error.message,true);
        return;
      }

      const requests = data || [];
      document.getElementById('countAll').textContent = requests.length;
      document.getElementById('countPending').textContent = requests.filter(r =>
        ['pending','submitted','under_review'].includes(String(r.status || '').toLowerCase())).length;
      document.getElementById('countApproved').textContent = requests.filter(r =>
        ['approved','approve'].includes(String(r.status || '').toLowerCase())).length;

      if (!requests.length) {
        list.innerHTML = '<div class="rounded-2xl border border-dashed bg-white px-6 py-12 text-center"><div class="mb-4 text-3xl text-violet-500"><i class="fa-solid fa-inbox"></i></div><h3 class="font-bold">ยังไม่มีคำขอเผยแพร่</h3><p class="mt-2 text-sm text-slate-500">เมื่อส่งคำขอแล้ว ประวัติจะแสดงที่หน้านี้</p><a href="./" class="mt-5 inline-block rounded-xl bg-violet-600 px-5 py-3 font-semibold text-white">กลับไปหน้าหลัก</a></div>';
        return;
      }

      list.innerHTML = '';
      requests.forEach(request => {
        const status = statusInfo(request.status);
        const card = document.createElement('article');
        card.className = 'rounded-2xl border bg-white p-5 shadow-sm';

        const heading = document.createElement('div');
        heading.className = 'flex flex-wrap items-start justify-between gap-3';

        const title = document.createElement('h3');
        title.className = 'break-words font-bold text-slate-900';
        title.textContent = request.title || 'ไม่มีชื่อสคริปต์';

        const badge = document.createElement('span');
        badge.className = 'inline-flex shrink-0 items-center gap-2 rounded-full px-3 py-1.5 text-xs font-semibold ' + status.style;
        const icon = document.createElement('i');
        icon.className = 'fa-solid ' + status.icon;
        badge.append(icon,document.createTextNode(status.label));
        heading.append(title,badge);

        const details = document.createElement('div');
        details.className = 'mt-4 space-y-2 text-sm text-slate-500';
        const submitted = document.createElement('p');
        submitted.textContent = 'วันที่ส่ง: ' + formatDate(request.submitted_at);
        const version = document.createElement('p');
        version.textContent = 'เวอร์ชันคำขอ: ' + (request.version_no || 1);
        details.append(submitted,version);

        if (request.reviewed_at) {
          const reviewed = document.createElement('p');
          reviewed.textContent = 'วันที่ตรวจสอบ: ' + formatDate(request.reviewed_at);
          details.appendChild(reviewed);
        }
        card.append(heading,details);

        if (request.review_note) {
          const noteBox = document.createElement('div');
          noteBox.className = 'mt-4 rounded-xl bg-slate-50 p-4';
          const noteTitle = document.createElement('p');
          noteTitle.className = 'mb-1 text-xs font-semibold text-slate-500';
          noteTitle.textContent = 'หมายเหตุจาก Admin';
          const note = document.createElement('p');
          note.className = 'whitespace-pre-wrap break-words text-sm text-slate-700';
          note.textContent = request.review_note;
          noteBox.append(noteTitle,note);
          card.appendChild(noteBox);
        }
        list.appendChild(card);
      });
    }

    document.getElementById('refreshButton').addEventListener('click',loadRequests);
    supabaseClient.auth.onAuthStateChange(() => { loadRequests(); });
    loadRequests();
  </script>
</body>
</html>
