<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ติดต่อ | Monnt Hub</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <style>
    * {
      font-family: 'Prompt', sans-serif;
    }

    body {
      background:
        radial-gradient(
          circle at top left,
          rgba(59,130,246,.12),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(139,92,246,.12),
          transparent 35%
        ),
        #f8fafc;
    }

    .contact-card {
      transition:
        transform .25s ease,
        box-shadow .25s ease;
    }

    .contact-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 50px rgba(15,23,42,.12);
    }
  </style>

</head>

<body class="min-h-screen text-slate-800">

  <!-- Header -->

  <header
    class="border-b border-slate-200/80 bg-white/90 backdrop-blur-xl"
  >

    <div
      class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4"
    >

      <a
        href="../"
        class="flex items-center gap-3"
      >

        <div
          class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-blue-600 to-violet-600 text-white shadow-lg"
        >
          <i class="fa-solid fa-code"></i>
        </div>

        <div>

          <div class="font-bold text-slate-900">
            Monnt Hub
          </div>

          <div class="text-xs text-slate-500">
            ติดต่อเรา
          </div>

        </div>

      </a>


      <a
        href="../"
        class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 shadow-sm transition hover:border-blue-200 hover:bg-blue-50 hover:text-blue-600"
      >

        <i class="fa-solid fa-arrow-left"></i>

        กลับหน้าแรก

      </a>

    </div>

  </header>


  <!-- Main -->

  <main class="px-4 py-10 sm:py-14">

    <div class="mx-auto max-w-3xl">

      <!-- Hero -->

      <section
        class="mb-6 overflow-hidden rounded-[2rem] bg-gradient-to-br from-blue-600 via-indigo-600 to-violet-600 p-7 text-white shadow-2xl sm:p-10"
      >

        <div
          class="mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-white/15 text-2xl backdrop-blur-md"
        >
          <i class="fa-solid fa-headset"></i>
        </div>

        <h1
          class="text-3xl font-extrabold sm:text-4xl"
        >
          ติดต่อ Monnt Hub
        </h1>

        <p
          class="mt-3 max-w-2xl text-sm leading-7 text-blue-50 sm:text-base"
        >
          หากมีคำถาม ต้องการติดต่อทีมงาน หรือพบปัญหา
          สามารถติดต่อเราได้ผ่านช่องทางด้านล่าง
        </p>

      </section>


      <!-- Contact Card -->

      <section
        class="contact-card rounded-[2rem] border border-slate-200 bg-white p-6 shadow-lg sm:p-8"
      >

        <div
          class="flex flex-col items-center text-center"
        >

          <div
            class="mb-5 flex h-20 w-20 items-center justify-center rounded-3xl bg-gradient-to-br from-green-400 to-emerald-600 text-3xl text-white shadow-xl shadow-green-500/20"
          >
            <i class="fa-brands fa-line"></i>
          </div>


          <div
            class="mb-2 inline-flex items-center gap-2 rounded-full bg-green-50 px-4 py-2 text-xs font-semibold text-green-600"
          >

            <span
              class="h-2 w-2 rounded-full bg-green-500"
            ></span>

            LINE Official

          </div>


          <h2
            class="text-2xl font-bold text-slate-900"
          >
            ติดต่อผ่าน LINE
          </h2>


          <p
            class="mt-2 max-w-md text-sm leading-6 text-slate-500"
          >
            กดปุ่มด้านล่างเพื่อเพิ่มเพื่อนและติดต่อเราโดยตรง
          </p>


          <div class="mt-7">

            <a
              href="https://lin.ee/9aiuDOT"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-flex items-center justify-center rounded-2xl bg-white p-2 shadow-lg ring-1 ring-slate-200 transition hover:-translate-y-1 hover:shadow-xl"
            >

              <img
                src="https://scdn.line-apps.com/n/line_add_friends/btn/th.png"
                alt="เพิ่มเพื่อน"
                height="36"
                border="0"
              >

            </a>

          </div>

        </div>

      </section>


      <!-- Bottom -->

      <div class="mt-6 text-center">

        <p class="text-xs text-slate-400">
          © <span id="year"></span> Monnt Hub — All rights reserved.
        </p>

      </div>

    </div>

  </main>


  <script>
    document.getElementById('year').textContent =
      new Date().getFullYear();
  </script>

</body>

</html>
