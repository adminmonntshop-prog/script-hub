<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ติดต่อ | Monnt Hub</title>

  <meta
    name="description"
    content="ติดต่อ Monnt Hub และเพิ่มเพื่อนผ่าน LINE"
  >

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .soft-shadow {
      box-shadow: 0 20px 50px rgba(14, 165, 233, 0.12);
    }
  </style>
</head>

<body class="min-h-screen bg-sky-50 text-slate-700">

  <!-- Header -->
  <header class="border-b border-sky-100 bg-white/90 backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4">

      <a
        href="../"
        class="flex items-center gap-3"
      >
        <div
          class="flex h-11 w-11 items-center justify-center rounded-2xl bg-sky-500 text-white shadow-lg shadow-sky-200"
        >
          <i class="fa-solid fa-cloud"></i>
        </div>

        <div>
          <h1 class="text-lg font-extrabold text-sky-600">
            Monnt Hub
          </h1>

          <p class="text-xs text-slate-400">
            ติดต่อเรา
          </p>
        </div>
      </a>

      <!-- Back -->
      <a
        href="../"
        class="flex items-center gap-2 rounded-xl bg-sky-50 px-4 py-2.5 text-sm font-semibold text-sky-600 transition hover:bg-sky-100"
      >
        <i class="fa-solid fa-house"></i>
        หน้าแรก
      </a>

    </div>
  </header>


  <!-- Main -->
  <main class="px-5 py-12">

    <div class="mx-auto max-w-4xl">

      <!-- Title -->
      <div class="mb-10 text-center">

        <div
          class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-3xl bg-sky-100 text-2xl text-sky-500"
        >
          <i class="fa-solid fa-comments"></i>
        </div>

        <h2 class="text-3xl font-black text-slate-800">
          ติดต่อ
        </h2>

        <p class="mt-3 text-sm leading-7 text-slate-500">
          หากต้องการติดต่อหรือสอบถามข้อมูลเกี่ยวกับ Monnt Hub
          สามารถติดต่อเราได้ผ่านช่องทางด้านล่าง
        </p>

      </div>


      <!-- Contact Card -->
      <section
        class="soft-shadow overflow-hidden rounded-3xl border border-sky-100 bg-white"
      >

        <!-- Blue top -->
        <div class="bg-gradient-to-r from-sky-500 to-sky-400 px-7 py-8 text-white">

          <div class="flex items-center gap-4">

            <div
              class="flex h-14 w-14 items-center justify-center rounded-2xl bg-white/20 text-2xl backdrop-blur"
            >
              <i class="fa-solid fa-headset"></i>
            </div>

            <div>
              <h3 class="text-xl font-extrabold">
                Monnt Hub
              </h3>

              <p class="mt-1 text-sm text-sky-50">
                ช่องทางสำหรับติดต่อเรา
              </p>
            </div>

          </div>

        </div>


        <!-- Content -->
        <div class="p-7">

          <div class="rounded-2xl border border-sky-100 bg-sky-50 p-5">

            <div class="flex items-start gap-4">

              <div
                class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-white text-sky-500 shadow-sm"
              >
                <i class="fa-brands fa-line text-xl"></i>
              </div>

              <div>
                <h4 class="font-bold text-slate-800">
                  ติดต่อผ่าน LINE
                </h4>

                <p class="mt-1 text-sm leading-6 text-slate-500">
                  กดปุ่มด้านล่างเพื่อเพิ่มเพื่อนและติดต่อ Monnt Hub
                </p>
              </div>

            </div>


            <!-- LINE button -->
            <div class="mt-6">

              <a href="https://lin.ee/9aiuDOT">
                <img
                  src="https://scdn.line-apps.com/n/line_add_friends/btn/th.png"
                  alt="เพิ่มเพื่อน"
                  height="36"
                  border="0"
                >
              </a>

            </div>

          </div>

        </div>

      </section>


      <!-- Footer info -->
      <div class="mt-8 text-center">

        <p class="text-xs text-slate-400">
          © Monnt Hub
        </p>

      </div>

    </div>

  </main>

</body>
</html>
