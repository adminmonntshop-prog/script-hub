<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ติดต่อ | Monnt Hub</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      font-family: 'Prompt', sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #f8fafc;
    }

    .soft-shadow {
      box-shadow:
        0 20px 50px rgba(14, 165, 233, 0.12);
    }

  </style>

</head>


<body class="min-h-screen text-slate-800">


  <!-- HEADER -->

  <header
    class="border-b border-sky-100 bg-white/95 backdrop-blur-xl"
  >

    <div
      class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-4 sm:px-5"
    >

      <!-- LOGO -->

      <a
        href="../"
        class="flex min-w-0 items-center gap-3"
        aria-label="กลับหน้าแรก"
      >

        <div
          id="logoBox"
          class="flex h-11 w-11 shrink-0 items-center justify-center overflow-hidden rounded-2xl bg-sky-100 text-sky-500 shadow-sm"
        >

          <i class="fa-solid fa-code text-lg"></i>

        </div>


        <div class="min-w-0">

          <div
            id="siteName"
            class="truncate text-base font-bold text-slate-900 sm:text-lg"
          >
            Monnt Hub
          </div>

          <div
            class="text-xs text-slate-500"
          >
            ติดต่อเรา
          </div>

        </div>

      </a>


      <!-- HOME -->

      <a
        href="../"
        class="inline-flex shrink-0 items-center gap-2 rounded-xl bg-sky-50 px-3 py-2.5 text-sm font-semibold text-sky-600 transition hover:bg-sky-100 sm:px-4"
      >

        <i class="fa-solid fa-house"></i>

        <span class="hidden sm:inline">
          หน้าแรก
        </span>

      </a>

    </div>

  </header>


  <!-- MAIN -->

  <main class="px-4 py-10 sm:px-5 sm:py-12">

    <div class="mx-auto max-w-4xl">


      <!-- TITLE -->

      <div class="mb-8 text-center sm:mb-10">

        <div
          id="titleLogo"
          class="mx-auto mb-5 flex h-16 w-16 items-center justify-center overflow-hidden rounded-3xl bg-sky-100 text-2xl text-sky-500 shadow-sm"
        >

          <i class="fa-solid fa-comments"></i>

        </div>


        <h1
          class="text-3xl font-black text-slate-800"
        >
          ติดต่อ
        </h1>


        <p
          class="mx-auto mt-3 max-w-xl text-sm leading-7 text-slate-500"
        >

          หากต้องการติดต่อหรือสอบถามข้อมูลเกี่ยวกับ

          <span
            id="siteNameText"
            class="font-semibold text-sky-600"
          >
            Monnt Hub
          </span>

          สามารถติดต่อเราได้ผ่านช่องทางด้านล่าง

        </p>

      </div>


      <!-- CONTACT CARD -->

      <section
        class="soft-shadow overflow-hidden rounded-3xl border border-sky-100 bg-white"
      >


        <!-- BLUE HEADER -->

        <div
          class="bg-gradient-to-r from-sky-500 to-blue-600 px-6 py-7 text-white sm:px-7 sm:py-8"
        >

          <div class="flex items-center gap-4">

            <div
              class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-white/20 text-2xl backdrop-blur"
            >

              <i class="fa-solid fa-headset"></i>

            </div>


            <div class="min-w-0">

              <h2
                id="cardSiteName"
                class="truncate text-xl font-extrabold"
              >
                Monnt Hub
              </h2>

              <p
                class="mt-1 text-sm text-sky-50"
              >
                ช่องทางสำหรับติดต่อเรา
              </p>

            </div>

          </div>

        </div>


        <!-- CONTENT -->

        <div class="p-5 sm:p-7">

          <div
            class="rounded-2xl border border-sky-100 bg-sky-50 p-5 sm:p-6"
          >


            <div
              class="flex items-start gap-4"
            >

              <div
                class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-white text-sky-500 shadow-sm"
              >

                <i class="fa-brands fa-line text-xl"></i>

              </div>


              <div class="min-w-0">

                <h3
                  class="font-bold text-slate-800"
                >
                  ติดต่อผ่าน LINE
                </h3>

                <p
                  class="mt-1 text-sm leading-6 text-slate-500"
                >

                  กดปุ่มด้านล่างเพื่อเพิ่มเพื่อนและติดต่อ

                  <span id="lineSiteName">
                    Monnt Hub
                  </span>

                </p>

              </div>

            </div>


            <!-- LINE BUTTON -->

            <div class="mt-6">

              <a
                href="https://lin.ee/9aiuDOT"
                target="_blank"
                rel="noopener noreferrer"
              >

                <img
                  src="https://scdn.line-apps.com/n/line_add_friends/btn/th.png"
                  alt="เพิ่มเพื่อน"
                  height="36"
                  border="0"
                >

              </a>

            </div>

          </div>

        </div>

      </section>


      <!-- FOOTER -->

      <div class="mt-8 text-center">

        <p
          class="text-xs text-slate-400"
        >

          ©

          <span id="footerYear"></span>

          <span id="footerSiteName">
            Monnt Hub
          </span>

        </p>

      </div>

    </div>

  </main>


  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      'https://ofwlofzqxfdqctmogntu.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_JMUKzfqgrnXJwYy_zjLzKg_vMDyJTld';


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            flowType: 'pkce'
          }
        }
      );


    /* =========================
       ELEMENTS
    ========================= */

    const logoBox =
      document.getElementById('logoBox');

    const titleLogo =
      document.getElementById('titleLogo');

    const siteName =
      document.getElementById('siteName');

    const siteNameText =
      document.getElementById('siteNameText');

    const cardSiteName =
      document.getElementById('cardSiteName');

    const lineSiteName =
      document.getElementById('lineSiteName');

    const footerSiteName =
      document.getElementById('footerSiteName');

    const footerYear =
      document.getElementById('footerYear');


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return '';

      }

      return String(value)

        .replace(/&/g, '&amp;')

        .replace(/</g, '&lt;')

        .replace(/>/g, '&gt;')

        .replace(/"/g, '&quot;')

        .replace(/'/g, '&#039;');

    }


    /* =========================
       SET LOGO
    ========================= */

    function setLogo(
      logoUrl,
      currentSiteName
    ) {

      if (!logoUrl) {

        return;

      }


      const safeLogoUrl =
        escapeHtml(
          String(logoUrl)
        );


      const safeSiteName =
        escapeHtml(
          currentSiteName
        );


      const logoHtml = `

        <img
          src="${safeLogoUrl}"
          alt="${safeSiteName}"
          class="h-full w-full object-cover"
          loading="eager"
          onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=&quot;fa-solid fa-code text-lg&quot;></i>';"
        >

      `;


      logoBox.innerHTML =
        logoHtml;


      titleLogo.innerHTML =
        logoHtml;

    }


    /* =========================
       LOAD SITE SETTINGS
    ========================= */

    async function loadSiteSettings() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient

            .from('site_settings')

            .select(
              'site_name, logo_url'
            )

            .eq(
              'id',
              true
            )

            .maybeSingle();


        if (error) {

          console.error(
            'Contact loadSiteSettings:',
            error
          );

          return;

        }


        if (!data) {

          console.warn(
            'ไม่พบข้อมูล site_settings'
          );

          return;

        }


        /* =====================
           SITE NAME
        ===================== */

        const currentSiteName =
          data.site_name ||
          'Monnt Hub';


        document.title =
          `${currentSiteName} | ติดต่อ`;


        siteName.textContent =
          currentSiteName;


        siteNameText.textContent =
          currentSiteName;


        cardSiteName.textContent =
          currentSiteName;


        lineSiteName.textContent =
          currentSiteName;


        footerSiteName.textContent =
          currentSiteName;


        /* =====================
           LOGO
        ===================== */

        if (
          data.logo_url &&
          String(data.logo_url).trim() !== ''
        ) {

          setLogo(
            data.logo_url,
            currentSiteName
          );

        }

      } catch (error) {

        console.error(
          'Contact site settings error:',
          error
        );

      }

    }


    /* =========================
       FOOTER YEAR
    ========================= */

    footerYear.textContent =
      new Date().getFullYear();


    /* =========================
       START
    ========================= */

    loadSiteSettings();

  </script>

</body>

</html>
