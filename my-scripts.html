<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สคริปต์ของฉัน - Monnt Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Prompt', sans-serif; }
textarea { resize: vertical; }
</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
<header class="border-b bg-white">
  <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
    <a href="./" class="font-bold text-violet-700">
      <i class="fa-solid fa-code mr-2"></i>Monnt Hub
    </a>
    <a href="./" class="rounded-xl border px-4 py-2 text-sm">กลับหน้าหลัก</a>
  </div>
</header>

<main class="mx-auto max-w-5xl px-4 py-8">
  <section class="mb-6 rounded-3xl bg-gradient-to-r from-violet-600 to-indigo-600 p-6 text-white shadow-lg">
    <h1 class="text-2xl font-bold">
      <i class="fa-solid fa-folder-open mr-2"></i>สคริปต์ของฉัน
    </h1>
    <p class="mt-2 text-sm text-white/80">
      ดูสคริปต์ของคุณ และส่งคำขอแก้ไขให้ Admin ตรวจสอบก่อนเผยแพร่
    </p>
  </section>

  <div class="mb-5 grid grid-cols-2 gap-3 sm:grid-cols-3">
    <div class="rounded-2xl border bg-white p-4">
      <p class="text-xs text-slate-500">สคริปต์ทั้งหมด</p>
      <p id="countAll" class="mt-1 text-2xl font-bold">—</p>
    </div>
    <div class="rounded-2xl border bg-white p-4">
      <p class="text-xs text-slate-500">เผยแพร่อยู่</p>
      <p id="countLive" class="mt-1 text-2xl font-bold text-emerald-600">—</p>
    </div>
    <div class="col-span-2 rounded-2xl border bg-white p-4 sm:col-span-1">
      <p class="text-xs text-slate-500">ระงับหรืออยู่ในถังขยะ</p>
      <p id="countOther" class="mt-1 text-2xl font-bold text-amber-600">—</p>
    </div>
  </div>

  <div class="mb-4 flex items-center justify-between gap-3">
    <h2 class="text-lg font-bold">รายการของฉัน</h2>
    <button id="refreshButton" class="rounded-xl border bg-white px-4 py-2 text-sm">
      <i class="fa-solid fa-rotate mr-1"></i>รีเฟรช
    </button>
  </div>

  <div id="message" class="mb-4 hidden rounded-xl p-4 text-sm"></div>
  <div id="scriptList" class="grid gap-4 sm:grid-cols-2"></div>

<div id="editModal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-900/60 p-4">
  <div class="mx-auto my-8 max-w-2xl rounded-2xl bg-white p-5 shadow-xl">
    <h2 class="text-xl font-bold">ส่งคำขอแก้ไขสคริปต์</h2>
    <p class="mt-1 text-sm text-slate-500">
      ข้อมูลใหม่จะรอแอดมินตรวจสอบก่อนนำไปเผยแพร่
    </p>

    <form id="editForm" class="mt-5 space-y-4">
      <input type="hidden" id="editScriptId">

      <div>
        <label for="editTitle" class="mb-1 block text-sm font-semibold">ชื่อสคริปต์</label>
        <input id="editTitle" required maxlength="150"
          class="w-full rounded-xl border p-3">
      </div>

      <div>
        <label for="editDescription" class="mb-1 block text-sm font-semibold">คำอธิบาย</label>
        <textarea id="editDescription" rows="3"
          class="w-full rounded-xl border p-3"></textarea>
      </div>

      <div>
        <label for="editImage" class="mb-1 block text-sm font-semibold">URL รูปภาพ</label>
        <input id="editImage" type="url" maxlength="2000"
          placeholder="https://..."
          class="w-full rounded-xl border p-3">
      </div>

      <div>
        <label for="editCategory" class="mb-1 block text-sm font-semibold">หมวดหมู่</label>
        <select id="editCategory" class="w-full rounded-xl border bg-white p-3">
          <option value="">ไม่ระบุหมวดหมู่</option>
        </select>
      </div>

      <div>
        <label for="editDistributor" class="mb-1 block text-sm font-semibold">ผู้จัดจำหน่าย</label>
        <input id="editDistributor" maxlength="200"
          class="w-full rounded-xl border p-3">
      </div>

      <div>
        <label for="editCode" class="mb-1 block text-sm font-semibold">โค้ดสคริปต์</label>
        <textarea id="editCode" required rows="12" spellcheck="false"
          class="w-full rounded-xl border p-3 font-mono text-sm"></textarea>
      </div>

      <div id="editFormMessage" class="hidden rounded-xl p-3 text-sm"></div>

      <div class="flex flex-wrap justify-end gap-2">
        <button type="button" id="cancelEdit"
          class="rounded-xl border px-4 py-2">ยกเลิก</button>
        <button type="submit" id="submitEdit"
          class="rounded-xl bg-violet-600 px-4 py-2 font-semibold text-white">
          ส่งคำขอให้แอดมิน
        </button>
      </div>
    </form>
  </div>
</div>

</main>

<script>
const SUPABASE_URL = 'https://ofwlofzqxfdqctmogntu.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_JMUKzfqgrnXJwYy_zjLzKg_vMDyJTld';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      flowType: 'pkce'
    }
  }
);

const list = document.getElementById('scriptList');
const message = document.getElementById('message');

let currentUser = null;
let myScripts = [];
  
const editModal = document.getElementById('editModal');
const editForm = document.getElementById('editForm');
const editFormMessage = document.getElementById('editFormMessage');
const editSubmitButton = document.getElementById('submitEdit');

function showEditMessage(text, isError = false) {
  editFormMessage.textContent = text;
  editFormMessage.className =
    'rounded-xl p-3 text-sm ' +
    (isError ? 'bg-red-50 text-red-700' : 'bg-blue-50 text-blue-700');
}

async function openEditForm(script) {
  if (!currentUser) {
    showMessage('กรุณาเข้าสู่ระบบก่อน', true);
    return;
  }

  editForm.reset();
  editFormMessage.className = 'hidden';
  document.getElementById('editScriptId').value = script.id;
  document.getElementById('editTitle').value = script.title || '';
  document.getElementById('editDescription').value = script.description || '';
  document.getElementById('editImage').value = script.image || '';
  document.getElementById('editDistributor').value = script.distributor || '';
  document.getElementById('editCode').value = script.code || '';

  const categorySelect = document.getElementById('editCategory');
  categorySelect.innerHTML = '<option value="">ไม่ระบุหมวดหมู่</option>';

  const { data: categories, error } = await supabaseClient
    .from('categories')
    .select('id,name')
    .order('name');

  if (error) {
    showMessage('โหลดหมวดหมู่ไม่สำเร็จ: ' + error.message, true);
    return;
  }

  for (const category of categories || []) {
    const option = document.createElement('option');
    option.value = category.id;
    option.textContent = category.name;
    categorySelect.appendChild(option);
  }

  categorySelect.value = script.category_id || '';
  editModal.classList.remove('hidden');
}

document.getElementById('cancelEdit').addEventListener('click', () => {
  editModal.classList.add('hidden');
});

editForm.addEventListener('submit', async (event) => {
  event.preventDefault();

  if (!currentUser) {
    showEditMessage('กรุณาเข้าสู่ระบบใหม่อีกครั้ง', true);
    return;
  }

  const scriptId = Number(document.getElementById('editScriptId').value);
  const script = myScripts.find(item => item.id === scriptId);

  if (!script || script.owner_id !== currentUser.id) {
    showEditMessage('ไม่พบสคริปต์ของคุณหรือไม่มีสิทธิ์แก้ไข', true);
    return;
  }

  if (script.deleted_at || script.suspended_at) {
    showEditMessage('สคริปต์ที่ถูกลบหรือระงับไม่สามารถส่งคำขอแก้ไขได้', true);
    return;
  }

  const title = document.getElementById('editTitle').value.trim();
  const code = document.getElementById('editCode').value;
  const image = document.getElementById('editImage').value.trim();

  if (!title || !code.trim()) {
    showEditMessage('กรุณากรอกชื่อและโค้ดสคริปต์', true);
    return;
  }

  if (image) {
    try {
      const url = new URL(image);
      if (url.protocol !== 'https:' && url.protocol !== 'http:') {
        throw new Error('invalid protocol');
      }
    } catch {
      showEditMessage('URL รูปภาพไม่ถูกต้อง', true);
      return;
    }
  }

  editSubmitButton.disabled = true;
  editSubmitButton.textContent = 'กำลังส่งคำขอ...';

  try {
    const { data, error } = await supabaseClient.rpc(
      'submit_publication_request',
      {
        p_script_id: scriptId,
        p_title: title,
        p_description: document.getElementById('editDescription').value.trim(),
        p_image: image,
        p_code: code,
        p_category_id: document.getElementById('editCategory').value || null,
        p_distributor: document.getElementById('editDistributor').value.trim()
      }
    );

    if (error) throw error;

    showMessage(
      'ส่งคำขอแก้ไขเรียบร้อยแล้ว เลขที่คำขอ: ' + data +
      ' กรุณารอแอดมินตรวจสอบ'
    );
    editModal.classList.add('hidden');
  } catch (error) {
    showEditMessage('ส่งคำขอไม่สำเร็จ: ' + error.message, true);
  } finally {
    editSubmitButton.disabled = false;
    editSubmitButton.textContent = 'ส่งคำขอให้แอดมิน';
  }
});


function showMessage(text, error = false) {
  message.textContent = text;
  message.className = 'mb-4 rounded-xl p-4 text-sm ' +
    (error ? 'bg-red-50 text-red-700' : 'bg-blue-50 text-blue-700');
}

function getStatus(script) {
  if (script.deleted_at) return 'อยู่ในถังขยะ';
  if (script.suspended_at) return 'ถูกระงับ';
  if (script.is_visible === false) return 'ไม่แสดงบนหน้าเว็บ';
  return 'เผยแพร่อยู่';
}

async function loadScripts() {
  list.innerHTML = '<div class="rounded-2xl border bg-white p-8 text-center">กำลังโหลด...</div>';
  message.classList.add('hidden');

  const { data: { user }, error: authError } =
    await supabaseClient.auth.getUser();

  if (authError || !user) {
    currentUser = null;
    list.innerHTML = '';
    showMessage('กรุณาเข้าสู่ระบบก่อนดูสคริปต์ของคุณ', true);
    return;
  }

  currentUser = user;

  const { data, error } = await supabaseClient
    .from('scripts')
    .select('id,title,description,image,code,status,category_id,distributor,is_visible,owner_id,suspended_at,deleted_at,created_at')
    .eq('owner_id', user.id)
    .order('created_at', { ascending: false });

  if (error) {
    list.innerHTML = '';
    showMessage('โหลดสคริปต์ไม่สำเร็จ: ' + error.message, true);
    return;
  }

  myScripts = data || [];

  document.getElementById('countAll').textContent = myScripts.length;
  document.getElementById('countLive').textContent =
    myScripts.filter(s => !s.deleted_at && !s.suspended_at && s.is_visible !== false).length;
  document.getElementById('countOther').textContent =
    myScripts.filter(s => s.deleted_at || s.suspended_at || s.is_visible === false).length;

  list.innerHTML = '';

  if (!myScripts.length) {
    list.innerHTML = `
      <div class="rounded-2xl border border-dashed bg-white p-8 text-center sm:col-span-2">
        <i class="fa-solid fa-folder-open mb-3 text-3xl text-violet-400"></i>
        <h3 class="font-bold">ยังไม่มีสคริปต์ของคุณ</h3>
        <p class="mt-2 text-sm text-slate-500">
          สคริปต์ที่ Admin อนุมัติและเป็นของคุณจะแสดงที่นี่
        </p>
        <a href="./" class="mt-4 inline-block rounded-xl bg-violet-600 px-5 py-3 text-white">
          กลับหน้าหลัก
        </a>
      </div>`;
    return;
  }

  myScripts.forEach(script => {
    const card = document.createElement('article');
    card.className = 'rounded-2xl border bg-white p-5 shadow-sm';

    const title = document.createElement('h3');
    title.className = 'break-words font-bold';
    title.textContent = script.title || 'ไม่มีชื่อสคริปต์';

    const status = document.createElement('p');
    status.className = 'my-2 text-sm text-slate-500';
    status.textContent = getStatus(script);

    const description = document.createElement('p');
    description.className = 'mb-4 whitespace-pre-wrap break-words text-sm text-slate-600';
    description.textContent = script.description || 'ไม่มีคำอธิบาย';

    card.append(title, status, description);

    if (script.image) {
      const image = document.createElement('img');
      image.src = script.image;
      image.alt = '';
      image.className = 'mb-3 max-h-48 w-full rounded-xl object-cover';
      image.onerror = () => image.remove();
      card.prepend(image);
    }

    const editButton = document.createElement('button');
    editButton.className = 'rounded-xl bg-violet-600 px-4 py-2 text-sm font-semibold text-white';
    editButton.textContent = 'ขอแก้ไข';
    editButton.addEventListener('click', () => {
  openEditForm(script);
});
      showMessage('สคริปต์ ID ' + script.id + ': ขั้นตอนส่งคำขอแก้ไขจะเชื่อมกับระบบอนุมัติของ Admin');
    });

    card.appendChild(editButton);
    list.appendChild(card);
  });
}

document.getElementById('refreshButton')
  .addEventListener('click', loadScripts);

supabaseClient.auth.onAuthStateChange(() => {
  loadScripts();
});

loadScripts();
</script>
</body>
</html>
